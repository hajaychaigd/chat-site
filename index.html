<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕋صلي علي النبي</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f2f2;
    }

    .app {
      max-width: 400px; /* تم تصغير عرض الشاشة هنا */
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* رسائلك أنت (في اليمين) */
    .message {
      background: #dcf8c6;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 12px;
      width: fit-content;
      max-width: 80%;
      margin-right: auto;
      word-break: break-word;
    }

    /* رسائل الطرف الآخر (في الشمال) */
    .message.other {
      background: #eeeeee;
      margin-right: 0;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      background: #075e54;
      color: white;
      padding: 0 18px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #064e46;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      صلي علي النبي 🕋
    </div>

    <div class="messages" id="messages">
      <!-- رسالة الترحيب المؤقتة -->
      <div class="message other" id="welcomeMessage">
        💜💜💜
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك..."
      >

      <button onclick="sendMessage()">
        إرسال
      </button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYcuxbU0QttsO1DfDF_qQZPbRYSfTj4fs",
      authDomain: "chat-site-2911b.firebaseapp.com",
      projectId: "chat-site-2911b",
      storageBucket: "chat-site-2911b.firebasestorage.app",
      messagingSenderId: "7306613696",
      appId: "1:7306613696:web:5479f7634c7e903bbdae25",
      measurementId: "G-KZ4L2JHQN4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // معرف فريد للمتصفح
    let myId = localStorage.getItem("chat_user_id");
    if (!myId) {
      myId = 'user_' + Math.random().toString(36).substring(2);
      localStorage.setItem("chat_user_id", myId);
    }

    // إخفاء رسالة 💜💜💜 بعد 4 ثواني تماماً
    setTimeout(() => {
      const welcomeMsg = document.getElementById("welcomeMessage");
      if (welcomeMsg) {
        welcomeMsg.remove();
      }
    }, 4000);

    // دالة الإرسال
    window.sendMessage = async function() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") {
        return;
      }

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          senderId: myId,
          createdAt: Date.now()
        });
        input.value = "";
      } catch (error) {
        console.error("خطأ في الإرسال: ", error);
      }
    };

    // دعم زر Enter
    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    // جلب وعرض الرسائل لحظياً
    const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    
    onSnapshot(q, (snapshot) => {
      const messagesContainer = document.getElementById("messages");
      
      // تفريغ الحاوية وإعادة بناء الرسائل القادمة من قاعدة البيانات فقط
      messagesContainer.innerHTML = '';

      snapshot.forEach((doc) => {
        const data = doc.data();
        const messageDiv = document.createElement("div");
        
        if (data.senderId === myId) {
          messageDiv.className = "message";
        } else {
          messageDiv.className = "message other";
        }

        messageDiv.textContent = data.text;
        messageDiv.dataset.createdAt = data.createdAt;
        
        messagesContainer.appendChild(messageDiv);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    // فحص كل ثانية لمسح الرسائل التي مر عليها 30 ثانية تلقائياً
    setInterval(() => {
      const messageDivs = document.querySelectorAll(".messages .message");
      const now = Date.now();

      messageDivs.forEach(div => {
        const createdAt = parseInt(div.dataset.createdAt);
        if (createdAt && (now - createdAt > 30000)) { 
          div.remove();
        }
      });
    }, 1000);
  </script>

</body>
</html>
