<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕋صلي علي النبي</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
    }

    .app {
      max-width: 400px;
      height: 100%;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ff5252;
      display: inline-block;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
      transition: background-color 0.3s ease;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      background: #dcf8c6;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 12px;
      width: fit-content;
      max-width: 80%;
      margin-right: auto;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .message.other {
      background: #eeeeee;
      margin-right: 0;
      margin-left: auto;
    }

    .message-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #888;
    }

    .timer-text {
      font-size: 10px;
      color: #888;
      font-weight: bold;
    }

    .read-receipt {
      font-size: 12px;
      color: gray;
      font-weight: bold;
    }
    
    .read-receipt.read {
      color: #34b7f1;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
      background: white;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      background: #075e54;
      color: white;
      padding: 0 18px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #064e46;
    }

    #blockScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #075e54;
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 9999;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body onclick="unlockAudio()">

  <div id="blockScreen">
    ❌ عذراً، الشات مشغول حالياً مع مستخدم آخر. يجوز لمستخدم واحد فقط التحدث مع المدير في نفس الوقت. الرجاء المحاولة لاحقاً.
  </div>

  <div class="app">

    <div class="header">
      <div class="header-title">
        <span id="statusDot" class="status-dot"></span>
        <span>صلي علي النبي 🕋</span>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="message other" id="welcomeMessage">
        💜💜💜
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك..."
      >

      <button onclick="sendMessage()">
        إرسال
      </button>
    </div>

  </div>

  <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYcuxbU0QttsO1DfDF_qQZPbRYSfTj4fs",
      authDomain: "chat-site-2911b.firebaseapp.com",
      projectId: "chat-site-2911b",
      storageBucket: "chat-site-2911b.firebasestorage.app",
      messagingSenderId: "7306613696",
      appId: "1:7306613696:web:5479f7634c7e903bbdae25",
      measurementId: "G-KZ4L2JHQN4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'mysecret123') {
      localStorage.setItem("is_admin", "true");
      alert("تم تفعيل هذا الجهاز كجهاز أساسي للتنبيهات بنجاح! 🔔");
    }

    const isAdmin = localStorage.getItem("is_admin") === "true";

    let myId = localStorage.getItem("chat_user_id");
    if (!myId) {
      myId = 'user_' + Math.random().toString(36).substring(2);
      localStorage.setItem("chat_user_id", myId);
    }

    if (!isAdmin) {
      const activeUserRef = doc(db, "status", "active_visitor");
      
      async function checkVisitorAccess() {
        const docSnap = await getDoc(activeUserRef);
        const now = Date.now();

        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.active && data.userId !== myId && (now - data.lastSeen < 10000)) {
            document.getElementById("blockScreen").style.display = "flex";
            return;
          }
        }
        await setDoc(activeUserRef, { active: true, userId: myId, lastSeen: Date.now() });
      }

      checkVisitorAccess();

      setInterval(async () => {
        await setDoc(activeUserRef, { active: true, userId: myId, lastSeen: Date.now() });
      }, 4000);

      window.addEventListener("beforeunload", async () => {
        await setDoc(activeUserRef, { active: false, userId: myId, lastSeen: Date.now() });
      });
    }

    const pageLoadTime = Date.now();

    if (isAdmin) {
      const adminStatusRef = doc(db, "status", "admin_status");
      setDoc(adminStatusRef, { online: true, lastSeen: Date.now() });

      const heartbeat = setInterval(() => {
        setDoc(adminStatusRef, { online: true, lastSeen: Date.now() }, { merge: true });
      }, 4000);

      const setOffline = async () => {
        clearInterval(heartbeat);
        await setDoc(adminStatusRef, { online: false, lastSeen: 0 });
      };

      window.addEventListener("pagehide", setOffline);
      window.addEventListener("beforeunload", setOffline);
    }

    const statusQuery = doc(db, "status", "admin_status");
    onSnapshot(statusQuery, (docSnap) => {
      const statusDot = document.getElementById("statusDot");
      if (docSnap.exists()) {
        const data = docSnap.data();
        const now = Date.now();
        if (data.online && (now - data.lastSeen < 7000)) {
          statusDot.style.backgroundColor = "#4CAF50";
        } else {
          statusDot.style.backgroundColor = "#ff5252";
        }
      } else {
        statusDot.style.backgroundColor = "#ff5252";
      }
    });

    window.unlockAudio = function() {
      const sound = document.getElementById("notificationSound");
      if (sound) {
        sound.play().then(() => {
          sound.pause();
          sound.currentTime = 0;
        }).catch(e => console.log(e));
      }
    };

    setTimeout(() => {
      const welcomeMsg = document.getElementById("welcomeMessage");
      if (welcomeMsg) {
        welcomeMsg.remove();
      }
    }, 5000);

    window.sendMessage = async function() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") return;

      const currentTime = Date.now();
      input.value = "";

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          senderId: myId,
          isAdminMessage: isAdmin,
          createdAt: currentTime,
          read: isAdmin
        });
      } catch (error) {
        console.error("خطأ في الإرسال: ", error);
      }
    };

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    const messageElements = {};

    onSnapshot(q, (snapshot) => {
      const messagesContainer = document.getElementById("messages");

      snapshot.docChanges().forEach((change) => {
        const docId = change.doc.id;
        const data = change.doc.data();

        if (change.type === "added") {
          const now = Date.now();
          const expiryTime = data.isAdminMessage ? Infinity : 45000;

          if (data.isAdminMessage || (now - data.createdAt <= expiryTime)) {
            const messageDiv = document.createElement("div");
            messageDiv.id = "msg_" + docId;
            
            if (data.senderId === myId) {
              messageDiv.className = "message";
            } else {
              messageDiv.className = "message other";
              
              if (data.createdAt > pageLoadTime && data.senderId !== myId && isAdmin) {
                const sound = document.getElementById("notificationSound");
                if (sound) {
                  sound.currentTime = 0;
                  sound.play().catch(err => console.log(err));
                }
              }
            }

            const textSpan = document.createElement("span");
            textSpan.textContent = data.text;
            messageDiv.appendChild(textSpan);

            const footerDiv = document.createElement("div");
            footerDiv.className = "message-footer";

            if (data.isAdminMessage) {
              messageDiv.classList.add("admin-msg");
            } else {
              const timerSpan = document.createElement("span");
              timerSpan.className = "timer-text";
              footerDiv.appendChild(timerSpan);
              messageDiv.dataset.createdAt = data.createdAt;
            }

            const readReceipt = document.createElement("span");
            readReceipt.className = "read-receipt " + (data.read ? "read" : "");
            readReceipt.innerHTML = "✓✓";
            footerDiv.appendChild(readReceipt);

            messageDiv.appendChild(footerDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            messageElements[docId] = { element: messageDiv, data: data };

            if (isAdmin && !data.isAdminMessage && !data.read) {
              updateDoc(doc(db, "messages", docId), { read: true });
            }
          }
        } 
        else if (change.type === "modified") {
          if (messageElements[docId]) {
            const readReceipt = messageElements[docId].element.querySelector(".read-receipt");
            if (readReceipt && data.read) {
              readReceipt.classList.add("read");
            }
          }
        }
        else if (change.type === "removed") {
          if (messageElements[docId]) {
            messageElements[docId].element.remove();
            delete messageElements[docId];
          }
        }
      });
    });

    // عداد تنازلي يعرض الأرقام الصافية فقط بدون أي حروف أو نصوص زائدة
    setInterval(() => {
      const now = Date.now();
      for (const docId in messageElements) {
        const item = messageElements[docId];
        if (item.data.isAdminMessage) continue;

        const createdAt = item.data.createdAt;
        const timeLeft = 45000 - (now - createdAt);

        if (timeLeft <= 0) {
          item.element.remove();
          delete messageElements[docId];
        } else {
          const timerSpan = item.element.querySelector(".timer-text");
          if (timerSpan) {
            timerSpan.textContent = Math.ceil(timeLeft / 1000);
          }
        }
      }
    }, 1000);
  </script>

</body>
</html>
