<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الضرب بالشبشب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a202c 0%, #0f172a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        header {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: 2.2rem;
            color: #f87171;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.5);
            margin-bottom: 5px;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: inline-block;
        }

        .counter {
            font-weight: bold;
            color: #fbbf24;
            font-size: 1.5rem;
        }

        /* Price Board - قريبة من عدد الضربات */
        .price-board {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #fbbf24;
            border-radius: 15px;
            padding: 10px 15px;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
            z-index: 20;
            backdrop-filter: blur(5px);
            width: 280px;
            margin-top: 5px;
        }

        .price-board h3 {
            color: #fbbf24;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(251, 191, 36, 0.3);
            padding-bottom: 4px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .price-item:last-child {
            margin-bottom: 0;
        }

        /* Stage Layout */
        .stage {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        /* Target Flag Container */
        .target-container {
            position: relative;
            z-index: 2;
        }

        .flag {
            width: 220px;
            height: 140px;
            background-color: #ffffff;
            border: 3px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 0;
            overflow: hidden;
            transition: transform 0.05s ease;
        }

        .flag-stripe {
            height: 24px;
            background-color: #0038b8;
            width: 100%;
        }

        .star-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .star-of-david {
            width: 50px;
            height: 50px;
            fill: none;
            stroke: #0038b8;
            stroke-width: 3.5;
        }

        /* Slipper Styling */
        .slipper {
            position: absolute;
            width: 90px;
            height: 140px;
            bottom: -160px;
            z-index: 5;
            cursor: pointer;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
            transition: transform 0.1s linear;
        }

        /* Controls */
        .controls {
            margin-bottom: 10px;
            z-index: 10;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-hit {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
            transition: all 0.1s ease;
            outline: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>يوسف</h1>
        <div class="score-board">
            عدد الضربات: <span id="counter" class="counter">0</span>
        </div>
        
        <!-- يفطة الأسعار أصبحت هنا بجانب العنوان وعدد الضربات -->
        <div class="price-board">
            <h3>قائمة الهدايا 🎁</h3>
            <div class="price-item">
                <span>🌹 وردة / 🍦 أيس كريم:</span>
                <strong>ضربة واحدة</strong>
            </div>
            <div class="price-item">
                <span>🍩 دونات:</span>
                <strong>30 ضربة</strong>
            </div>
            <div class="price-item">
                <span>🫶 قلب وأيادي:</span>
                <strong>100 ضربة</strong>
            </div>
        </div>
    </header>

    <div class="stage" id="stage">
        <div class="target-container" id="targetContainer">
            <div class="flag" id="flag">
                <div class="flag-stripe"></div>
                <div class="star-container">
                    <svg class="star-of-david" viewBox="0 0 100 100">
                        <polygon points="50,15 90,85 10,85" />
                        <polygon points="50,85 90,15 10,15" />
                    </svg>
                </div>
                <div class="flag-stripe"></div>
            </div>
        </div>

        <svg class="slipper" id="slipper" viewBox="0 0 100 160">
            <path d="M 30,10 C 60,5 90,20 85,60 C 82,90 88,120 75,150 C 60,162 30,162 20,145 C 10,120 15,80 15,50 C 15,20 20,12 30,10 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="4"/>
            <path d="M 32,18 C 55,14 80,27 76,60 C 73,88 80,115 68,142 C 55,152 30,152 23,138 C 15,115 20,78 20,50 C 20,26 24,20 32,18 Z" fill="#60a5fa"/>
            <path d="M 20,65 Q 50,45 50,85" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
            <path d="M 80,65 Q 50,45 50,85" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
            <circle cx="50" cy="85" r="7" fill="#dc2626" />
        </svg>
    </div>

    <div class="controls">
        <button class="btn-hit" id="hitBtn">
            <span>اضرب بالشبشب!</span>
            <span>🩴</span>
        </button>
        <button class="btn-reset" id="resetBtn">
            <span>إعادة الضبط</span>
            <span>🔄</span>
        </button>
    </div>

    <script>
        const hitBtn = document.getElementById('hitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const slipper = document.getElementById('slipper');
        const counterEl = document.getElementById('counter');

        let score = 0;

        function slap() {
            score++;
            counterEl.innerText = score;
            slipper.style.transform = 'translateY(-220px) rotate(-720deg)';
            setTimeout(() => {
                slipper.style.transform = 'none';
            }, 150);
        }

        hitBtn.addEventListener('click', slap);
        resetBtn.addEventListener('click', () => {
            score = 0;
            counterEl.innerText = score;
        });
    </script>
</body>
</html>
