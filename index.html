<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق ضرب بالشبشب التفاعلي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      width: 360px;
      height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Target Flag Styling */
    .target-container {
      position: relative;
      width: 220px;
      height: 140px;
      border: 3px solid #444;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      background: #fff;
    }

    .target-flag {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .stripe {
      height: 28px;
      background-color: #0038b8;
    }

    .star-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hexagram {
      width: 44px;
      height: 44px;
      border: 4px solid #0038b8;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    /* Hit Reaction Animation */
    .shake {
      animation: hitShake 0.6s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes hitShake {
      10%, 90% { transform: translate3d(-3px, 3px, 0) rotate(-4deg); }
      20%, 80% { transform: translate3d(5px, -3px, 0) rotate(4deg); }
      30%, 50%, 70% { transform: translate3d(-8px, 6px, 0) rotate(-7deg); }
      40%, 60% { transform: translate3d(8px, -6px, 0) rotate(7deg); }
    }

    /* Realistic Detailed Slipper */
    .slipper-wrapper {
      position: absolute;
      top: -160px;
      right: -100px;
      width: 120px;
      height: 240px;
      pointer-events: none;
      transform-origin: top center;
      z-index: 10;
    }

    .slipper-body {
      width: 85px;
      height: 185px;
      background: linear-gradient(135deg, #2b2b2b 0%, #111111 100%);
      border-radius: 42px 42px 30px 30px;
      position: relative;
      box-shadow: -8px 15px 25px rgba(0,0,0,0.7);
      border: 3px solid #333;
    }

    /* طبقة النعل الداخلية المرنة */
    .slipper-inner-sole {
      width: 75px;
      height: 173px;
      background: linear-gradient(135deg, #e53935, #c62828);
      border-radius: 38px 38px 25px 25px;
      position: absolute;
      top: 3px;
      left: 2px;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
    }

    /* خطوط وتعرجات النعل الواقعية */
    .sole-texture {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 40px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0.3;
    }
    .texture-line {
      height: 3px;
      background: #000;
      border-radius: 2px;
    }

    /* أشرطة الشبشب المطاطية المقوسة الواقعية */
    .strap-left {
      width: 18px;
      height: 75px;
      background: linear-gradient(90deg, #ffffff, #dcdcdc);
      position: absolute;
      top: 35px;
      left: 6px;
      transform: rotate(-28deg);
      border-radius: 10px;
      box-shadow: 2px 4px 6px rgba(0,0,0,0.4);
      border-left: 2px solid #bbb;
    }

    .strap-right {
      width: 18px;
      height: 75px;
      background: linear-gradient(90deg, #ffffff, #dcdcdc);
      position: absolute;
      top: 35px;
      right: 6px;
      transform: rotate(28deg);
      border-radius: 10px;
      box-shadow: -2px 4px 6px rgba(0,0,0,0.4);
      border-right: 2px solid #bbb;
    }

    /* Slow & Realistic Slower Strike Animation (0.8s) */
    .slap-animation {
      animation: slowSlap 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes slowSlap {
      0% {
        transform: rotate(0deg) translate(0, 0);
      }
      35% {
        transform: rotate(15deg) translate(30px, -20px) scale(1.05); /* رفع بسيط للخلف للتهيئة */
      }
      60% {
        transform: rotate(-75deg) translate(-120px, 150px) scale(1.2); /* الهبوط والضرب ببطء وثقل */
      }
      80% {
        transform: rotate(-65deg) translate(-110px, 140px) scale(1.15); /* لحظة التثبيت على الهدف */
      }
      100% {
        transform: rotate(0deg) translate(0, 0); /* العودة للوضع الطبيعي بمرونة */
      }
    }

    /* Controls UI */
    .controls {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .btn-hit {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-hit:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(255, 75, 43, 0.4);
    }

    .counter {
      font-size: 20px;
      font-weight: bold;
      color: #ffca28;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="target-container" id="target">
      <div class="target-flag">
        <div class="stripe"></div>
        <div class="star-container">
          <div class="hexagram"></div>
        </div>
        <div class="stripe"></div>
      </div>
    </div>

    <!-- شكل الشبشب المفصل -->
    <div class="slipper-wrapper" id="slipper">
      <div class="slipper-body">
        <div class="slipper-inner-sole">
          <div class="strap-left"></div>
          <div class="strap-right"></div>
          <div class="sole-texture">
            <div class="texture-line"></div>
            <div class="texture-line"></div>
            <div class="texture-line"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="counter">عدد الضربات: <span id="hit-count">0</span> 🩴</div>
    <button class="btn-hit" id="hit-btn">اضغط للضرب (ورده 🌹)</button>
  </div>

  <script>
    const hitBtn = document.getElementById('hit-btn');
    const slipper = document.getElementById('slipper');
    const target = document.getElementById('target');
    const hitCountEl = document.getElementById('hit-count');

    let count = 0;

    hitBtn.addEventListener('click', () => {
      // إزالة الأنيماشن السابقة لإعادة تشغيلها بسلاسة
      slipper.classList.remove('slap-animation');
      target.classList.remove('shake');

      // إعادة تهيئة العناصر
      void slipper.offsetWidth;
      slipper.classList.add('slap-animation');

      // تأخير هزة العلم لتتزامن بدقة مع لحظة ملامسة الشبشب (في منتصف الأنيماشن البطيء)
      setTimeout(() => {
        target.classList.add('shake');
      }, 450);

      // زيادة عداد الضربات
      count++;
      hitCountEl.textContent = count;
    });
  </script>
</body>
</html>
