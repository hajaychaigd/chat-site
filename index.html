
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اضرب العلم بالشبشب 😂</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #171717, #343434);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 600px;
}

h1 {
    font-size: 30px;
    margin-bottom: 40px;
}

.flag-area {
    position: relative;
    height: 240px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.flag {
    width: 320px;
    height: 190px;
    background: white;
    position: relative;
    box-shadow: 0 5px 20px #0008;
    transform-origin: center;
}

.stripe {
    position: absolute;
    width: 100%;
    height: 22px;
    background: #0038b8;
}

.top { top: 20px; }
.bottom { bottom: 20px; }

.star {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 85px;
    color: #0038b8;
}

.slipper {
    position: absolute;
    right: -120px;
    top: 55px;
    font-size: 100px;
    transform: rotate(-35deg);
    z-index: 5;
}

.hit {
    animation: hit 0.45s ease-in-out;
}

@keyframes hit {
    0% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(35px) rotate(8deg); }
    50% { transform: translateX(-25px) rotate(-8deg); }
    75% { transform: translateX(15px) rotate(5deg); }
    100% { transform: translateX(0) rotate(0); }
}

.slipper.attack {
    animation: attack 0.45s ease-in-out;
}

@keyframes attack {
    0% { right: -120px; }
    45% { right: 110px; }
    100% { right: -120px; }
}

button {
    margin-top: 30px;
    padding: 18px 35px;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 15px;
    background: #e63946;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #92202a;
}

button:active {
    transform: translateY(4px);
    box-shadow: none;
}

.counter {
    margin-top: 25px;
    font-size: 23px;
    color: #ffd166;
}

</style>
</head>

<body>

<div class="container">

<h1>😂 تحدي الشبشب 😂</h1>

<div class="flag-area">

    <div class="flag" id="flag">
        <div class="stripe top"></div>
        <div class="stripe bottom"></div>
        <div class="star">✡</div>
    </div>

    <div class="slipper" id="slipper">🩴</div>

</div>

<button onclick="hitFlag()">اضرب بالشبشب! 🩴</button>

<div class="counter">
    عدد الضربات: <span id="count">0</span>
</div>

</div>

<script>
let count = 0;

function hitFlag() {
    const flag = document.getElementById("flag");
    const slipper = document.getElementById("slipper");

    flag.classList.remove("hit");
    slipper.classList.remove("attack");

    void flag.offsetWidth;
    void slipper.offsetWidth;

    flag.classList.add("hit");
    slipper.classList.add("attack");

    count++;

    document.getElementById("count").textContent = count;

    // صوت ضربة بسيط
    const audio = new AudioContext();
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = 110;
    oscillator.type = "triangle";

    gain.gain.setValueAtTime(0.3, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001, audio.currentTime + 0.15
    );

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.15);
}
</script>

</body>
</html>
