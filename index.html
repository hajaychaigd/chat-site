<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0D0D0D;
      background-image: radial-gradient(#262626 1px, transparent 1px);
      background-size: 24px 24px;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.95rem;
      color: #A3A3A3;
    }

    .counter-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 16px;
      background-color: #1F1F1F;
      color: #D4D4D4;
      border: 1px solid #333333;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      flex-grow: 1;
    }

    .card-scene {
      width: 100%;
      height: 440px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 28px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      background-color: #FFFFFF;
      color: #171717;
      border: 1px solid #FFFFFF;
    }

    /* ظهر الكارت (أبيض ناصع) */
    .card-front {
      background: linear-gradient(180deg, #FFFFFF 0%, #FAFAFA 100%);
    }

    .support-tag {
      font-size: 0.85rem;
      color: #737373;
      background: #F5F5F5;
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid #E5E5E5;
    }

    .rose-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: auto 0;
    }

    .tiktok-rose {
      width: 90px;
      height: 90px;
      filter: drop-shadow(0 6px 12px rgba(224, 112, 134, 0.25));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-scene:hover .tiktok-rose {
      transform: scale(1.08);
    }

    .support-text {
      font-size: 1.05rem;
      color: #262626;
      font-weight: 700;
      line-height: 1.5;
    }

    .tap-hint {
      font-size: 0.85rem;
      color: #A3A3A3;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    /* وجه الكارت (النصيحة - أبيض) */
    .card-back {
      transform: rotateY(180deg);
      background-color: #FFFFFF;
    }

    .advice-category {
      font-size: 0.85rem;
      font-weight: 700;
      color: #262626;
      background-color: #F5F5F5;
      border: 1px solid #E5E5E5;
      padding: 5px 14px;
      border-radius: 10px;
    }

    .advice-text {
      font-size: 1.2rem;
      line-height: 1.75;
      color: #171717;
      font-weight: 700;
      margin: auto 0;
      word-break: break-word;
    }

    .actions-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #E5E5E5;
      background-color: #F5F5F5;
      color: #262626;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn:hover {
      background-color: #E5E5E5;
      color: #0A0A0A;
    }

    .primary-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #333333;
      background-color: #FFFFFF;
      color: #0D0D0D;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
    }

    .primary-btn:hover {
      background-color: #E5E5E5;
      transform: translateY(-2px);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      background-color: #FFFFFF;
      color: #0D0D0D;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

    // State
    let availableIndexes = [];
    let viewedCount = 0;
    let isFlipped = false;
    let audioCtx = null;

    // Elements
    const cardScene = document.getElementById('cardScene');
    const card = document.getElementById('card');
    const adviceCategory = document.getElementById('adviceCategory');
    const adviceText = document.getElementById('adviceText');
    const counter = document.getElementById('counter');
    const nextBtn = document.getElementById('nextBtn');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    // Web Audio Flip Sound
    function playFlipSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // Reset & Shuffle
    function resetIndexes() {
      availableIndexes = Array.from({ length: advices.length }, (_, i) => i);
      for (let i = availableIndexes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [availableIndexes[i], availableIndexes[j]] = [availableIndexes[j], availableIndexes[i]];
      }
    }

    // Get Next Advice
    function getRandomAdvice() {
      if (availableIndexes.length === 0) {
        resetIndexes();
      }
      const index = availableIndexes.pop();
      return advices[index];
    }

    // Update Advice Content
    function updateAdviceContent() {
      const advice = getRandomAdvice();
      adviceCategory.textContent = advice.cat;
      adviceText.textContent = advice.text;
      
      viewedCount++;
      if (viewedCount > advices.length) viewedCount = 1;
      counter.textContent = `النصيحة: ${viewedCount} / ${advices.length}`;
    }

    // Flip Card Logic
    function flipCard() {
      playFlipSound();
      isFlipped = !isFlipped;
      
      if (isFlipped) {
        if (adviceText.textContent.includes('اضغط لتوليد')) {
          updateAdviceContent();
        }
        card.classList.add('is-flipped');
      } else {
        card.classList.remove('is-flipped');
      }
    }

    // Show Next Advice
    function handleNext() {
      if (isFlipped) {
        card.classList.remove('is-flipped');
        isFlipped = false;
        playFlipSound();
        setTimeout(() => {
          updateAdviceContent();
          card.classList.add('is-flipped');
          isFlipped = true;
          playFlipSound();
        }, 350);
      } else {
        updateAdviceContent();
        card.classList.add('is-flipped');
        isFlipped = true;
        playFlipSound();
      }
    }

    // Copy Advice
    function copyAdvice(e) {
      e.stopPropagation();
      const textToCopy = `"${adviceText.textContent}" - ${adviceCategory.textContent}`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      });
    }

    // Initialize
    resetIndexes();

    // Event Listeners
    cardScene.addEventListener('click', flipCard);
    nextBtn.addEventListener('click', handleNext);
    copyBtn.addEventListener('click', copyAdvice);
  </script>
