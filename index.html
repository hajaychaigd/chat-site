<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الضرب بالشبشب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a202c 0%, #0f172a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        header {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            color: #f87171;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.5);
            margin-bottom: 8px;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .counter {
            font-weight: bold;
            color: #fbbf24;
            font-size: 1.5rem;
        }

        /* Stage Layout */
        .stage {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        /* Target Flag Container */
        .target-container {
            position: relative;
            z-index: 2;
        }

        .flag {
            width: 220px;
            height: 140px;
            background-color: #ffffff;
            border: 3px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 0;
            overflow: hidden;
            transition: transform 0.05s ease;
        }

        .flag-stripe {
            height: 24px;
            background-color: #0038b8;
            width: 100%;
        }

        .star-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* SVG Star of David */
        .star-of-david {
            width: 50px;
            height: 50px;
            fill: none;
            stroke: #0038b8;
            stroke-width: 3.5;
        }

        /* Slipper Styling */
        .slipper {
            position: absolute;
            width: 90px;
            height: 140px;
            bottom: -160px;
            z-index: 5;
            cursor: pointer;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
            transition: transform 0.1s linear;
        }

        /* Screen Shake Animation */
        .shake {
            animation: shakeAnim 0.15s ease-in-out infinite;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-8px, 5px) rotate(-3deg); }
            50% { transform: translate(8px, -5px) rotate(3deg); }
            75% { transform: translate(-5px, -5px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Particles & Floating Text */
        .hit-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            color: #ef4444;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 2px 2px 0px #000;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: scale(0.5) translateY(0); }
            50% { transform: scale(1.3) translateY(-30px); }
            100% { opacity: 0; transform: scale(1) translateY(-60px); }
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: explode 0.5s ease-out forwards;
        }

        @keyframes explode {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
        }

        /* Control Buttons Layout */
        .controls {
            margin-bottom: 20px;
            z-index: 10;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-hit {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 16px 45px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: all 0.1s ease;
            outline: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-hit:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(239, 68, 68, 0.6);
        }

        .btn-hit:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.15s ease;
            outline: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-reset:active {
            transform: translateY(1px);
        }

        /* Slap Mark */
        .slap-mark {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            transform: scale(0);
            pointer-events: none;
            animation: slapRipple 0.4s ease-out forwards;
        }

        @keyframes slapRipple {
            0% { transform: scale(0.2); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>ضرب بالشبشب 🩴</h1>
        <div class="score-board">
            عدد الضربات: <span id="counter" class="counter">0</span>
        </div>
    </header>

    <div class="stage" id="stage">
        <!-- Target Flag -->
        <div class="target-container" id="targetContainer">
            <div class="flag" id="flag">
                <div class="flag-stripe"></div>
                <div class="star-container">
                    <svg class="star-of-david" viewBox="0 0 100 100">
                        <polygon points="50,15 90,85 10,85" />
                        <polygon points="50,85 90,15 10,15" />
                    </svg>
                </div>
                <div class="flag-stripe"></div>
            </div>
        </div>

        <!-- Slipper SVG -->
        <svg class="slipper" id="slipper" viewBox="0 0 100 160">
            <!-- Sole Base -->
            <path d="M 30,10 C 60,5 90,20 85,60 C 82,90 88,120 75,150 C 60,162 30,162 20,145 C 10,120 15,80 15,50 C 15,20 20,12 30,10 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="4"/>
            <!-- Sole Texture Inner -->
            <path d="M 32,18 C 55,14 80,27 76,60 C 73,88 80,115 68,142 C 55,152 30,152 23,138 C 15,115 20,78 20,50 C 20,26 24,20 32,18 Z" fill="#60a5fa"/>
            <!-- Straps (Flip-Flop V-Shape) -->
            <path d="M 20,65 Q 50,45 50,85" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
            <path d="M 80,65 Q 50,45 50,85" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
            <!-- Toe Peg -->
            <circle cx="50" cy="85" r="7" fill="#dc2626" />
        </svg>
    </div>

    <div class="controls">
        <button class="btn-hit" id="hitBtn">
            <span>اضرب بالشبشب!</span>
            <span>🩴</span>
        </button>
        <button class="btn-reset" id="resetBtn">
            <span>إعادة الضبط</span>
            <span>🔄</span>
        </button>
    </div>

    <script>
        const hitBtn = document.getElementById('hitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const slipper = document.getElementById('slipper');
        const flag = document.getElementById('flag');
        const stage = document.getElementById('stage');
        const counterEl = document.getElementById('counter');

        let score = 0;
        let isAnimating = false;

        // Audio Context for sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSlapSound() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Create noise buffer for slap sound
            const bufferSize = audioCtx.sampleRate * 0.12;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            // Filter for punchy slap sound
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        const hitWords = ['طَخْ!', 'بُومْ!', 'على وشّك!', 'خد دي!', 'احميه!'];

        function createParticles(x, y) {
            // Text effect
            const text = document.createElement('div');
            text.className = 'hit-text';
            text.innerText = hitWords[Math.floor(Math.random() * hitWords.length)];
            text.style.left = (x - 40) + 'px';
            text.style.top = (y - 30) + 'px';
            stage.appendChild(text);

            setTimeout(() => text.remove(), 600);

            // Particles
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const colors = ['#ef4444', '#fbbf24', '#ffffff', '#3b82f6'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const angle = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 80;
                const dx = Math.cos(angle) * dist + 'px';
                const dy = Math.sin(angle) * dist + 'px';

                particle.style.setProperty('--dx', dx);
                particle.style.setProperty('--dy', dy);
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                stage.appendChild(particle);

                setTimeout(() => particle.remove(), 500);
            }

            // Ripple on flag
            const ripple = document.createElement('div');
            ripple.className = 'slap-mark';
            ripple.style.left = (x - stage.offsetLeft - 25) + 'px';
            ripple.style.top = (y - stage.offsetTop - 25) + 'px';
            flag.appendChild(ripple);

            setTimeout(() => ripple.remove(), 400);
        }

        function slap() {
            if (isAnimating) return;
            isAnimating = true;

            // Animate slipper throw/slap
            slipper.style.transition = 'transform 0.12s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
            slipper.style.transform = 'translateY(-220px) rotate(-720deg) scale(1.3)';

            setTimeout(() => {
                // Impact moment
                playSlapSound();

                // Screen/Flag Shake
                document.body.classList.add('shake');
                flag.style.transform = 'scale(0.9) rotate(' + (Math.random() * 10 - 5) + 'deg)';

                // Update score
                score++;
                counterEl.innerText = score;

                // Particle effects at impact point
                const flagRect = flag.getBoundingClientRect();
                const stageRect = stage.getBoundingClientRect();
                const impactX = flagRect.left - stageRect.left + flagRect.width / 2;
                const impactY = flagRect.top - stageRect.top + flagRect.height / 2;

                createParticles(impactX, impactY);

                setTimeout(() => {
                    document.body.classList.remove('shake');
                    flag.style.transform = 'none';

                    // Reset slipper
                    slipper.style.transition = 'transform 0.15s ease-out';
                    slipper.style.transform = 'translateY(0) rotate(0deg) scale(1)';

                    setTimeout(() => {
                        isAnimating = false;
                    }, 150);
                }, 80);

            }, 120);
        }

        hitBtn.addEventListener('click', slap);

        // Reset Counter Function
        resetBtn.addEventListener('click', () => {
            score = 0;
            counterEl.innerText = score;
        });

        // Allow pressing space bar to hit
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                slap();
            }
        });
    </script>
</body>
</html>
