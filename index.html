<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕋 الردود</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f9f9f9;
      color: #0f0f0f;
      overflow: hidden;
    }

    .app {
      max-width: 480px;
      height: 100%;
      margin: auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .header {
      background: #ffffff;
      color: #0f0f0f;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: bold;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back-arrow {
      font-size: 20px;
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .users-counter {
      background: rgba(0, 0, 0, 0.05);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 5px;
    }

    .mute-btn {
      background: #2ba640;
      border: none;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 0 10px rgba(43, 166, 64, 0.4);
    }

    .mute-btn:hover {
      background: #238b35;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff5252;
      display: inline-block;
      transition: background-color 0.3s ease;
    }

    .ticker-container {
      background: #f1f1f1;
      color: #065fd4;
      padding: 6px 0;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      font-size: 12px;
      font-weight: bold;
      border-bottom: 1px solid #e5e5e5;
      display: none;
      direction: ltr;
    }

    .ticker-track {
      display: inline-flex;
      white-space: nowrap;
      animation: tickerAnimation 25s linear infinite;
    }

    .ticker-group {
      display: inline-flex;
      gap: 35px;
      padding-right: 35px;
      flex-shrink: 0;
    }

    @keyframes tickerAnimation {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #ffffff;
    }

    .message {
      display: flex;
      gap: 12px;
      font-size: 14px;
      position: relative;
      width: 100%;
      max-width: 100%;
      background: transparent;
      padding: 0;
      box-shadow: none;
    }

    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #065fd4;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      flex-shrink: 0;
    }

    .comment-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-header-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #606060;
    }

    .comment-username {
      color: #0f0f0f;
      font-weight: 500;
    }

    .message-text {
      color: #0f0f0f;
      line-height: 1.5;
      word-break: break-word;
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
      font-size: 12px;
      color: #606060;
    }

    .action-btn {
      background: none;
      border: none;
      color: #606060;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      font-size: 13px;
      box-shadow: none;
      width: auto;
      height: auto;
    }

    .action-btn:hover {
      color: #0f0f0f;
      background: none;
    }

    .message-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .timer-text {
      color: #cc0000;
      font-weight: bold;
      background: rgba(204, 0, 0, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .input-area {
      display: flex;
      padding: 10px 16px;
      background: #ffffff;
      border-top: 1px solid #e5e5e5;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cccccc;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      background: #f9f9f9;
      color: #0f0f0f;
    }

    input:focus {
      border-color: #065fd4;
      background: #ffffff;
    }

    button.send-btn {
      border: none;
      background: #065fd4;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: none;
      transition: background 0.2s;
    }

    button.send-btn:hover {
      background: #035ac5;
    }

    #blockScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #0f0f0f;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 9999;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div id="blockScreen">
    ❌ عذراً، الشات مشغول حالياً مع مستخدم آخر.<br>يُجوز لمستخدم واحد فقط التحدث مع المدير في نفس الوقت.<br>الرجاء المحاولة لاحقاً.
  </div>

  <div class="app">

    <div class="header">
      <div class="header-title">
        <span class="back-arrow">←</span>
        <span>الردود</span>
        <span id="statusDot" class="status-dot"></span>
      </div>
      <div class="header-actions">
        <button id="bellBtn" class="mute-btn" title="تنبيهات الجرس">🔔</button>
        <div id="usersCounter" class="users-counter">
          <span>👤</span> <span id="onlineCount">0</span>
        </div>
      </div>
    </div>

    <div id="tickerContainer" class="ticker-container">
      <div class="ticker-track">
        <div class="ticker-group">
          <span class="ticker-item">سبحان الله 📿</span>
          <span class="ticker-item">الحمد لله 📿</span>
          <span class="ticker-item">الله أكبر 📿</span>
          <span class="ticker-item">استغفر الله 📿</span>
        </div>
        <div class="ticker-group">
          <span class="ticker-item">سبحان الله 📿</span>
          <span class="ticker-item">الحمد لله 📿</span>
          <span class="ticker-item">الله أكبر 📿</span>
          <span class="ticker-item">استغفر الله 📿</span>
        </div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="إضافة رد..."
      >
      <button class="send-btn" onclick="sendMessage()">
        📿
      </button>
    </div>

  </div>

  <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, where, onSnapshot, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYcuxbU0QttsO1DfDF_qQZPbRYSfTj4fs",
      authDomain: "chat-site-2911b.firebaseapp.com",
      databaseURL: "https://chat-site-2911b-default-rtdb.firebaseio.com",
      projectId: "chat-site-2911b",
      storageBucket: "chat-site-2911b.firebasestorage.app",
      messagingSenderId: "7306613696",
      appId: "1:7306613696:web:5479f7634c7e903bbdae25",
      measurementId: "G-KZ4L2JHQN4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let blockIncomingFromAdmin = false;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'mysecret123') {
      localStorage.setItem("is_admin", "true");
      alert("تم تفعيل هذا الجهاز كجهاز أساسي للمدير بنجاح! 🔔");
    }

    const isAdmin = localStorage.getItem("is_admin") === "true";
    const bellBtn = document.getElementById("bellBtn");

    if (!isAdmin) {
      document.getElementById("tickerContainer").style.display = "block";
    } else {
      document.getElementById("usersCounter").style.display = "flex";
    }

    let myId = localStorage.getItem("chat_user_id");
    if (!myId) {
      myId = 'user_' + Math.random().toString(36).substring(2);
      localStorage.setItem("chat_user_id", myId);
    }

    bellBtn.addEventListener("click", async function() {
      if (isAdmin) return;

      const bellStatusRef = doc(db, "status", "bell_alert");
      try {
        const docSnap = await getDoc(bellStatusRef);
        let currentState = "green";
        if (docSnap.exists()) {
          currentState = docSnap.data().state || "green";
        }

        let newState = (currentState === "red") ? "green" : "red";
        await setDoc(bellStatusRef, { state: newState, timestamp: Date.now() });
      } catch (e) {
        console.log("خطأ في تحديث الجرس: ", e);
      }
    });

    const bellStatusRef = doc(db, "status", "bell_alert");
    onSnapshot(bellStatusRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        const state = data.state || "green";

        if (state === "red") {
          bellBtn.style.background = "#ff5252";
          bellBtn.style.boxShadow = "0 0 12px #ff5252";
          
          if (!isAdmin) {
            blockIncomingFromAdmin = true;
            for (const docId in messageElements) {
              messageElements[docId].element.remove();
              delete messageElements[docId];
            }
          }

          if (isAdmin) {
            const sound = document.getElementById("notificationSound");
            if (sound) {
              sound.currentTime = 0;
              sound.play().catch(e => console.log(e));
            }
          }
        } else {
          bellBtn.style.background = "#2ba640";
          bellBtn.style.boxShadow = "0 0 10px rgba(43, 166, 64, 0.4)";
          if (!isAdmin) {
            blockIncomingFromAdmin = false;
          }
        }
      }
    });

    const activeVisitorDocRef = doc(db, "status", "active_visitor");

    if (isAdmin) {
      const adminStatusRef = doc(db, "status", "admin_status");
      setDoc(adminStatusRef, { online: true, lastSeen: Date.now() });

      const heartbeat = setInterval(() => {
        setDoc(adminStatusRef, { online: true, lastSeen: Date.now() }, { merge: true });
      }, 4000);

      const setOffline = async () => {
        clearInterval(heartbeat);
        await setDoc(adminStatusRef, { online: false, lastSeen: 0 });
      };

      window.addEventListener("pagehide", setOffline);
      window.addEventListener("beforeunload", setOffline);

      onSnapshot(activeVisitorDocRef, (docSnap) => {
        const countSpan = document.getElementById("onlineCount");
        if (docSnap.exists()) {
          const data = docSnap.data();
          const now = Date.now();
          if (data.active && (now - data.lastSeen < 6000)) {
            countSpan.textContent = "1";
          } else {
            countSpan.textContent = "0";
          }
        } else {
          countSpan.textContent = "0";
        }
      });

    } else {
      async function registerVisitor() {
        try {
          const docSnap = await getDoc(activeVisitorDocRef);
          const now = Date.now();

          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.active && (now - data.lastSeen < 6000) && data.userId !== myId) {
              document.getElementById("blockScreen").style.display = "flex";
              return;
            }
          }

          await setDoc(activeVisitorDocRef, { active: true, userId: myId, lastSeen: Date.now() });

          const visitorHeartbeat = setInterval(async () => {
            try {
              await setDoc(activeVisitorDocRef, { active: true, userId: myId, lastSeen: Date.now() }, { merge: true });
            } catch(e) {}
          }, 3000);

          const removeVisitor = async () => {
            clearInterval(visitorHeartbeat);
            try {
              await setDoc(activeVisitorDocRef, { active: false, userId: null, lastSeen: 0 });
            } catch(e) {}
          };

          window.addEventListener("pagehide", removeVisitor);
          window.addEventListener("beforeunload", removeVisitor);

        } catch(e) { console.log(e); }
      }

      registerVisitor();
    }

    const pageLoadTime = Date.now();

    function updateStatusIndicator(data) {
      const statusDot = document.getElementById("statusDot");
      if (!statusDot) return;
      const now = Date.now();
      if (data && data.online && (now - data.lastSeen < 8000)) {
        statusDot.style.backgroundColor = "#2ba640";
      } else {
        statusDot.style.backgroundColor = "#ff5252";
      }
    }

    const statusQuery = doc(db, "status", "admin_status");
    getDoc(statusQuery).then((docSnap) => {
      if (docSnap.exists()) updateStatusIndicator(docSnap.data());
    });

    onSnapshot(statusQuery, (docSnap) => {
      updateStatusIndicator(docSnap.exists() ? docSnap.data() : null);
    });

    window.sendMessage = async function() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") return;

      const currentTime = Date.now();
      input.value = "";

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          senderId: myId,
          isAdminMessage: isAdmin,
          createdAt: currentTime,
          read: isAdmin
        });
      } catch (error) {
        console.error("خطأ في الإرسال: ", error);
      }
    };

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") sendMessage();
    });

    let q;
    if (isAdmin) {
      q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    } else {
      const fortyFiveSecondsAgo = Date.now() - 45000;
      q = query(
        collection(db, "messages"), 
        where("createdAt", ">=", fortyFiveSecondsAgo),
        orderBy("createdAt", "asc")
      );
    }

    const messageElements = {};

    onSnapshot(q, (snapshot) => {
      const messagesContainer = document.getElementById("messages");

      snapshot.docChanges().forEach((change) => {
        const docId = change.doc.id;
        const data = change.doc.data();

        if (change.type === "added") {
          if (messageElements[docId]) return;

          if (!isAdmin && blockIncomingFromAdmin && data.isAdminMessage) return;

          const messageDiv = document.createElement("div");
          messageDiv.id = "msg_" + docId;
          messageDiv.className = "message";

          const avatarDiv = document.createElement("div");
          avatarDiv.className = "comment-avatar";
          avatarDiv.textContent = data.isAdminMessage ? "م" : "ش";
          if(data.isAdminMessage) avatarDiv.style.background = "#cc0000";
          messageDiv.appendChild(avatarDiv);

          const bodyDiv = document.createElement("div");
          bodyDiv.className = "comment-body";

          const headerInfo = document.createElement("div");
          headerInfo.className = "comment-header-info";
          const userSpan = document.createElement("span");
          userSpan.className = "comment-username";
          userSpan.textContent = data.isAdminMessage ? "@المدير" : "@شيتوس-ل9ج8غ";
          headerInfo.appendChild(userSpan);
          bodyDiv.appendChild(headerInfo);

          const textSpan = document.createElement("span");
          textSpan.className = "message-text";
          textSpan.textContent = data.text;
          bodyDiv.appendChild(textSpan);

          const actionsDiv = document.createElement("div");
          actionsDiv.className = "comment-actions";
          
          const likeBtn = document.createElement("button");
          likeBtn.className = "action-btn";
          likeBtn.innerHTML = "👍 <span>1</span>";
          actionsDiv.appendChild(likeBtn);

          const dislikeBtn = document.createElement("button");
          dislikeBtn.className = "action-btn";
          dislikeBtn.innerHTML = "👎";
          actionsDiv.appendChild(dislikeBtn);

          const footerDiv = document.createElement("div");
          footerDiv.className = "message-footer";

          if (!isAdmin) {
            const timerSpan = document.createElement("span");
            timerSpan.className = "timer-text";
            footerDiv.appendChild(timerSpan);
            messageDividerData(messageDiv, data.createdAt);
          }

          actionsDiv.appendChild(footerDiv);
          bodyDiv.appendChild(actionsDiv);
          messageDiv.appendChild(bodyDiv);
          messagesContainer.appendChild(messageDiv);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;

          messageElements[docId] = { element: messageDiv, data: data };

          if (isAdmin && !data.isAdminMessage && !data.read) {
            updateDoc(doc(db, "messages", docId), { read: true });
          }

          if (isAdmin && data.createdAt > pageLoadTime && data.senderId !== myId) {
            const sound = document.getElementById("notificationSound");
            if (sound) {
              sound.currentTime = 0;
              sound.play().catch(err => console.log(err));
            }
          }
        } 
        else if (change.type === "removed") {
          if (messageElements[docId]) {
            messageElements[docId].element.remove();
            delete messageElements[docId];
          }
        }
      });
    });

    function messageDividerData(msgDiv, createdAt) {
      msgDiv.dataset.createdAt = createdAt;
    }

    if (!isAdmin) {
      setInterval(() => {
        const now = Date.now();
        for (const docId in messageElements) {
          const item = messageElements[docId];
          const createdAt = item.data.createdAt;
          const timeLeft = 35000 - (now - createdAt);

          if (timeLeft <= 0) {
            item.element.remove();
            delete messageElements[docId];
          } else {
            const timerSpan = item.element.querySelector(".timer-text");
            if (timerSpan) {
              timerSpan.textContent = Math.ceil(timeLeft / 1000);
            }
          }
        }
      }, 1000);
    }
  </script>

</body>
</html>
