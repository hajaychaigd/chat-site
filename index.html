<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕋صلي علي النبي</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
    }

    .app {
      max-width: 400px;
      height: 100%;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-indicator {
      font-size: 12px;
      font-weight: normal;
      color: #ffeb3b;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      background: #dcf8c6;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 12px;
      width: fit-content;
      max-width: 80%;
      margin-right: auto;
      word-break: break-word;
    }

    .message.other {
      background: #eeeeee;
      margin-right: 0;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
      background: white;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      background: #075e54;
      color: white;
      padding: 0 18px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #064e46;
    }
  </style>
</head>

<body onclick="unlockAudio()">

  <div class="app">

    <div class="header">
      <div>صلي علي النبي 🕋</div>
      <div id="statusText" class="status-indicator">جاري التحقق من الاتصال...</div>
    </div>

    <div class="messages" id="messages">
      <div class="message other" id="welcomeMessage">
        💜💜💜
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك..."
      >

      <button onclick="sendMessage()">
        إرسال
      </button>
    </div>

  </div>

  <!-- عنصر الصوت -->
  <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYcuxbU0QttsO1DfDF_qQZPbRYSfTj4fs",
      authDomain: "chat-site-2911b.firebaseapp.com",
      projectId: "chat-site-2911b",
      storageBucket: "chat-site-2911b.firebasestorage.app",
      messagingSenderId: "7306613696",
      appId: "1:7306613696:web:5479f7634c7e903bbdae25",
      measurementId: "G-KZ4L2JHQN4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'mysecret123') {
      localStorage.setItem("is_admin", "true");
      alert("تم تفعيل هذا الجهاز كجهاز أساسي للتنبيهات بنجاح! 🔔");
    }

    let myId = localStorage.getItem("chat_user_id");
    if (!myId) {
      myId = 'user_' + Math.random().toString(36).substring(2);
      localStorage.setItem("chat_user_id", myId);
    }

    const isAdmin = localStorage.getItem("is_admin") === "true";
    const pageLoadTime = Date.now();

    // نظام تحديث حالة الاتصال للمدير (أنت)
    if (isAdmin) {
      const adminStatusRef = doc(db, "status", "admin_status");
      
      // تحديث الحالة فوراً عند فتح الصفحة
      setDoc(adminStatusRef, { online: true, lastSeen: Date.now() });

      // إرسال إشارة "متصل" كل 5 ثوانٍ
      setInterval(() => {
        setDoc(adminStatusRef, { online: true, lastSeen: Date.now() });
      }, 5000);

      // تحويله لغير متصل عند إغلاق الصفحة
      window.addEventListener("beforeunload", () => {
        setDoc(adminStatusRef, { online: false, lastSeen: Date.now() });
      });
    }

    // مراقبة حالة اتصال المدير للزوار
    const statusQuery = doc(db, "status", "admin_status");
    onSnapshot(statusQuery, (docSnap) => {
      const statusText = document.getElementById("statusText");
      if (docSnap.exists()) {
        const data = docSnap.data();
        const now = Date.now();
        // إذا قام المدير بتحديث حالته خلال اخر 10 ثواني فهو متصل
        if (data.online && (now - data.lastSeen < 10000)) {
          statusText.textContent = "المدير متصل الآن 🟢";
        } else {
          statusText.textContent = "المدير غير متصل 🔴";
        }
      } else {
        statusText.textContent = "المدير غير متصل 🔴";
      }
    });

    // فك حظر الصوت بمجرد الضغط في أي مكان بالشاشة أول مرة
    window.unlockAudio = function() {
      const sound = document.getElementById("notificationSound");
      if (sound) {
        sound.play().then(() => {
          sound.pause();
          sound.currentTime = 0;
        }).catch(e => console.log(e));
      }
    };

    setTimeout(() => {
      const welcomeMsg = document.getElementById("welcomeMessage");
      if (welcomeMsg) {
        welcomeMsg.remove();
      }
    }, 5000);

    window.sendMessage = async function() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") return;

      const currentTime = Date.now();
      input.value = "";

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          senderId: myId,
          isAdminMessage: isAdmin, // تمييز ما إذا كانت الرسالة مرسلة من المدير أم لا
          createdAt: currentTime
        });
      } catch (error) {
        console.error("خطأ في الإرسال: ", error);
      }
    };

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    
    onSnapshot(q, (snapshot) => {
      const messagesContainer = document.getElementById("messages");

      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          const data = change.doc.data();
          const now = Date.now();

          // رسائل المستخدمين تقعد دقيقة (60 ثانية)، أما رسائل المدير تظل ظاهرة ودائمة
          const expiryTime = data.isAdminMessage ? Infinity : 60000;

          if (data.isAdminMessage || (now - data.createdAt <= expiryTime)) {
            const messageDiv = document.createElement("div");
            
            if (data.senderId === myId) {
              messageDiv.className = "message";
            } else {
              messageDiv.className = "message other";
              
              // التشغيل الفوري للصوت عند وصول رسالة جديدة وأنت المدير
              if (data.createdAt > pageLoadTime && data.senderId !== myId && isAdmin) {
                const sound = document.getElementById("notificationSound");
                if (sound) {
                  sound.currentTime = 0;
                  sound.play().catch(err => console.log("خطأ في تشغيل الصوت:", err));
                }
              }
            }

            messageDiv.textContent = data.text;
            messageDiv.dataset.createdAt = data.createdAt;
            messageDiv.dataset.isAdmin = data.isAdminMessage ? "true" : "false";
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }
        }
      });
    });

    // فحص دوري لمسح رسائل المستخدمين بعد دقيقة (60 ثانية) مع إبقاء رسائل المدير ثابتة
    setInterval(() => {
      const messageDivs = document.querySelectorAll(".messages .message:not(#welcomeMessage)");
      const now = Date.now();

      messageDivs.forEach(div => {
        const isAdminMsg = div.dataset.isAdmin === "true";
        const createdAt = parseInt(div.dataset.createdAt);

        // إذا لم تكن رسالة المدير، ومر عليها أكثر من دقيقة (60 ثانية)، يتم حذفها
        if (!isAdminMsg && createdAt && (now - createdAt > 60000)) { 
          div.remove();
        }
      });
    }, 1000);
  </script>

</body>
</html>
