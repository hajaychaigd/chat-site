<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق ضرب بالشبشب التفاعلي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      width: 320px;
      height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Target Flag Styling */
    .target-container {
      position: relative;
      width: 200px;
      height: 130px;
      border: 3px solid #555;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      background: #fff;
    }

    .target-flag {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .stripe {
      height: 25px;
      background-color: #0038b8;
    }

    .star-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hexagram {
      width: 40px;
      height: 40px;
      border: 4px solid #0038b8;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    /* Hit Reaction Animation */
    .shake {
      animation: hitShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes hitShake {
      10%, 90% { transform: translate3d(-2px, 2px, 0) rotate(-3deg); }
      20%, 80% { transform: translate3d(4px, -2px, 0) rotate(3deg); }
      30%, 50%, 70% { transform: translate3d(-6px, 4px, 0) rotate(-6deg); }
      40%, 60% { transform: translate3d(6px, -4px, 0) rotate(6deg); }
    }

    /* Detailed Realistic Slipper Drawing */
    .slipper-wrapper {
      position: absolute;
      top: -120px;
      right: -80px;
      width: 100px;
      height: 200px;
      pointer-events: none;
      transform-origin: top right;
      transition: transform 0.1s ease;
      z-index: 10;
    }

    .slipper-sole-outer {
      width: 70px;
      height: 150px;
      background: #2b2b2b;
      border-radius: 35px 35px 25px 25px;
      position: relative;
      box-shadow: -5px 10px 15px rgba(0,0,0,0.6);
      border: 3px solid #1a1a1a;
    }

    .slipper-sole-inner {
      width: 60px;
      height: 138px;
      background: linear-gradient(135deg, #d32f2f, #b71c1c);
      border-radius: 30px 30px 20px 20px;
      position: absolute;
      top: 3px;
      left: 2px;
    }

    .slipper-strap-left {
      width: 14px;
      height: 65px;
      background: #ffffff;
      position: absolute;
      top: 25px;
      left: 8px;
      transform: rotate(-25deg);
      border-radius: 6px;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.4);
    }

    .slipper-strap-right {
      width: 14px;
      height: 65px;
      background: #ffffff;
      position: absolute;
      top: 25px;
      right: 8px;
      transform: rotate(25deg);
      border-radius: 6px;
      box-shadow: -1px 2px 4px rgba(0,0,0,0.4);
    }

    /* Strike Animation */
    .slap-animation {
      animation: slapAction 0.25s forwards ease-in-out;
    }

    @keyframes slapAction {
      0% {
        transform: rotate(0deg) translate(0, 0);
      }
      50% {
        transform: rotate(-65deg) translate(-110px, 140px) scale(1.25);
      }
      100% {
        transform: rotate(0deg) translate(0, 0);
      }
    }

    /* Controls UI */
    .controls {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .btn-hit {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-hit:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(255, 75, 43, 0.4);
    }

    .counter {
      font-size: 20px;
      font-weight: bold;
      color: #ffca28;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="target-container" id="target">
      <div class="target-flag">
        <div class="stripe"></div>
        <div class="star-container">
          <div class="hexagram"></div>
        </div>
        <div class="stripe"></div>
      </div>
    </div>

    <div class="slipper-wrapper" id="slipper">
      <div class="slipper-sole-outer">
        <div class="slipper-sole-inner">
          <div class="slipper-strap-left"></div>
          <div class="slipper-strap-right"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="counter">عدد الضربات: <span id="hit-count">0</span> 🩴</div>
    <button class="btn-hit" id="hit-btn">اضغط للضرب (ورده 🌹)</button>
  </div>

  <script>
    const hitBtn = document.getElementById('hit-btn');
    const slipper = document.getElementById('slipper');
    const target = document.getElementById('target');
    const hitCountEl = document.getElementById('hit-count');

    let count = 0;

    hitBtn.addEventListener('click', () => {
      // إزالة الأنيميشن السابقة لإعادتها عند التكرار
      slipper.classList.remove('slap-animation');
      target.classList.remove('shake');

      // إعادة تفعيل الأنيميشن
      void slipper.offsetWidth;
      slipper.classList.add('slap-animation');

      // اهتزاز العلم عند وصول الضربة
      setTimeout(() => {
        target.classList.add('shake');
      }, 120);

      // زيادة عداد الضربات
      count++;
      hitCountEl.textContent = count;
    });
  </script>
</body>
</html>
