<!-- استبدل كود الـ <script type="module"> بالكامل بهذا الكود -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getFirestore, collection, addDoc, query, orderBy, where, onSnapshot, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBYcuxbU0QttsO1DfDF_qQZPbRYSfTj4fs",
    authDomain: "chat-site-2911b.firebaseapp.com",
    databaseURL: "https://chat-site-2911b-default-rtdb.firebaseio.com",
    projectId: "chat-site-2911b",
    storageBucket: "chat-site-2911b.firebasestorage.app",
    messagingSenderId: "7306613696",
    appId: "1:7306613696:web:5479f7634c7e903bbdae25",
    measurementId: "G-KZ4L2JHQN4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const isAdmin = localStorage.getItem("is_admin") === "true";
  let myId = localStorage.getItem("chat_user_id") || 'user_' + Math.random().toString(36).substring(2);
  localStorage.setItem("chat_user_id", myId);

  const activeVisitorDocRef = doc(db, "status", "active_visitor");

  if (isAdmin) {
    document.getElementById("usersCounter").style.display = "flex";
    
    // مراقبة فورية بدون تأخير
    onSnapshot(activeVisitorDocRef, (docSnap) => {
      const countSpan = document.getElementById("onlineCount");
      if (docSnap.exists() && docSnap.data().active === true) {
        countSpan.textContent = "1";
      } else {
        countSpan.textContent = "0";
      }
    });
  } else {
    // تسجيل الدخول
    setDoc(activeVisitorDocRef, { active: true, userId: myId });

    // تنظيف الحالة فوراً عند إغلاق الصفحة
    const cleanUp = () => {
      setDoc(activeVisitorDocRef, { active: false, userId: null });
    };

    window.addEventListener("pagehide", cleanUp);
    window.addEventListener("beforeunload", cleanUp);
  }

  // باقي الكود (الدوال والإرسال والاستقبال) يظل كما هو دون تغيير...
  // تأكد من ترك بقية دوال sendMessage و onSnapshot الخاصة بالرسائل كما كانت.
</script>
