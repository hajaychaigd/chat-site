<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الردود</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      color: #0f0f0f;
      overflow: hidden;
    }

    .app {
      max-width: 480px;
      height: 100%;
      margin: auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid #e5e5e5;
      border-right: 1px solid #e5e5e5;
    }

    /* الشريط العلوي */
    .header {
      background: #ffffff;
      color: #0f0f0f;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 600;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-arrow {
      font-size: 20px;
      cursor: pointer;
      color: #0f0f0f;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .action-top-btn {
      background: #f2f2f2;
      border: none;
      color: #0f0f0f;
      padding: 0;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .action-top-btn:hover {
      background: #e5e5e5;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #2cc067;
      display: inline-block;
    }

    /* منطقة التعليقات (على طراز يوتيوب) */
    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #ffffff;
    }

    .comment-container {
      display: flex;
      gap: 12px;
      position: relative;
      width: 100%;
    }

    /* الخط الرأسي الرفيع مثل يوتيوب بجانب الصورة */
    .comment-container::before {
      content: '';
      position: absolute;
      right: 18px;
      top: 40px;
      bottom: -16px;
      width: 1px;
      background-color: #e5e5e5;
    }

    .comment-container:last-child::before {
      display: none;
    }

    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
      z-index: 1;
    }

    .comment-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    /* اسم المستخدم مظلل بالأسود تماماً مثل يوتيوب */
    .comment-username {
      background-color: #0f0f0f !important;
      color: #ffffff !important;
      padding: 3px 12px;
      border-radius: 14px;
      font-weight: 500;
      font-size: 12px;
    }

    /* اسم المدير مظلل بلون مميز (أزرق غامق) */
    .comment-username.admin-name {
      background-color: #065fd4 !important;
      color: #ffffff !important;
    }

    .comment-time {
      font-size: 11px;
      color: #606060;
    }

    .comment-text {
      color: #0f0f0f;
      line-height: 1.4;
      word-break: break-word;
      font-size: 14px;
      margin-top: 2px;
    }

    .comment-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
      font-size: 12px;
      color: #606060;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      display: flex;
      align-items: center;
      color: #606060;
    }

    .comment-options {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #606060;
      padding: 0 4px;
      align-self: flex-start;
    }

    /* منطقة الكتابة السفلى */
    .input-area {
      display: flex;
      padding: 12px 16px;
      background: #ffffff;
      border-top: 1px solid #e5e5e5;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 18px;
      border: 1px solid #cccccc;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      background: #f9f9f9;
      color: #0f0f0f;
    }

    input[type="text"]:focus {
      border-color: #065fd4;
      background: #ffffff;
    }

    button.send-btn {
      border: none;
      background: #065fd4;
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }

    button.send-btn:hover {
      background: #054ada;
    }

    /* نافذة كلمة المرور */
    #passwordModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10001;
    }
    .password-card {
      background: #ffffff;
      color: #0f0f0f;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .password-card input {
      width: 100%;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .password-card button {
      background: #065fd4;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- نافذة كلمة المرور البسيطة والآمنة -->
  <div id="passwordModal">
    <div class="password-card">
      <h3>تسجيل الدخول للشات</h3>
      <p style="font-size: 12px; color: #606060;">اختر صفحتك (الزائر أو المدير)</p>
      <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" maxlength="10">
      <button id="submitPasswordBtn">دخول</button>
      <span id="passwordError" style="color: #cc0000; font-size: 12px; display: none;">كلمة المرور غير صحيحة!</span>
    </div>
  </div>

  <div class="app">
    <div class="header">
      <div class="header-title">
        <span class="back-arrow" id="backBtn">←</span>
        <span id="headerTitleText">الردود</span>
        <span class="status-dot"></span>
      </div>
      <div class="header-actions">
        <button id="callBtn" class="action-top-btn" title="اتصال">📞</button>
        <button id="bellBtn" class="action-top-btn" title="تنبيه" style="color: #2cc067;">🔔</button>
      </div>
    </div>

    <div class="messages" id="messagesContainer"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="إضافة رد...">
      <button class="send-btn" id="sendBtn" title="إرسال">
        <svg height="18" viewBox="0 0 24 24" width="18" fill="#ffffff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    // تحديد ما إذا كان المستخدم مديراً أو زائراً (كلمة مرور المدير: admin123 أو للزائر: 2005)
    let isAdmin = localStorage.getItem("chat_is_admin") === "true";
    const passwordModal = document.getElementById("passwordModal");
    const passwordInput = document.getElementById("passwordInput");
    const submitPasswordBtn = document.getElementById("submitPasswordBtn");
    const passwordError = document.getElementById("passwordError");
    const headerTitleText = document.getElementById("headerTitleText");

    // التحقق من الجلسة السابقة
    if (localStorage.getItem("chat_logged_in") === "true") {
      passwordModal.style.display = "none";
      updateHeaderTitle();
    }

    function handleLogin() {
      const val = passwordInput.value.trim();
      if (val === "admin123") {
        localStorage.setItem("chat_is_admin", "true");
        localStorage.setItem("chat_logged_in", "true");
        isAdmin = true;
        passwordModal.style.display = "none";
        updateHeaderTitle();
        loadMessages();
      } else if (val === "2005" || val === "") {
        localStorage.setItem("chat_is_admin", "false");
        localStorage.setItem("chat_logged_in", "true");
        isAdmin = false;
        passwordModal.style.display = "none";
        updateHeaderTitle();
        loadMessages();
      } else {
        passwordError.style.display = "block";
        passwordInput.value = "";
      }
    }

    submitPasswordBtn.addEventListener("click", handleLogin);
    passwordInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    function updateHeaderTitle() {
      if (isAdmin) {
        headerTitleText.textContent = "لوحة التحكم (المدير)";
      } else {
        headerTitleText.textContent = "الردود";
      }
    }

    // جلب الرسائل المخزنة أو بدء رسائل تجريبية افتراضية تطابق الصورة
    let messages = JSON.parse(localStorage.getItem("youtube_chat_messages")) || [
      { id: 1, text: "ننتت", isAdmin: false, time: "منذ دقيقتين" },
      { id: 2, text: "لا اله -الا- الله 7غ8م", isAdmin: true, time: "منذ دقيقة" },
      { id: 3, text: "تخ", isAdmin: false, time: "الآن" }
    ];

    const messagesContainer = document.getElementById("messagesContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    function renderMessages() {
      messagesContainer.innerHTML = "";
      messages.forEach(msg => {
        const containerDiv = document.createElement("div");
        containerDiv.className = "comment-container";

        // الصورة الرمزية
        const avatarDiv = document.createElement("div");
        avatarDiv.className = "comment-avatar";
        if (msg.isAdmin) {
          avatarDiv.textContent = "ل";
          avatarDiv.style.background = "#065fd4";
        } else {
          avatarDiv.textContent = "ش";
          avatarDiv.style.background = "#2cc067";
        }
        containerDiv.appendChild(avatarDiv);

        const contentDiv = document.createElement("div");
        contentDiv.className = "comment-content";

        const headerDiv = document.createElement("div");
        headerDiv.className = "comment-header";

        // اسم المستخدم (مظلل بالأسود أو أزرق للمدير)
        const userSpan = document.createElement("span");
        userSpan.className = "comment-username";
        if (msg.isAdmin) {
          userSpan.classList.add("admin-name");
          userSpan.textContent = "@المدير";
        } else {
          userSpan.textContent = "@شيتوس-ل9ج8غ";
        }
        headerDiv.appendChild(userSpan);

        const timeSpan = document.createElement("span");
        timeSpan.className = "comment-time";
        timeSpan.textContent = `• ${msg.time}`;
        headerDiv.appendChild(timeSpan);
        contentDiv.appendChild(headerDiv);

        const textDiv = document.createElement("div");
        textDiv.className = "comment-text";
        textDiv.textContent = msg.text;
        contentDiv.appendChild(textDiv);

        // أزرار التفاعل تحت التعليق
        const footerDiv = document.createElement("div");
        footerDiv.className = "comment-footer";

        const actionGroup = document.createElement("div");
        actionGroup.className = "action-group";

        const likeBtn = document.createElement("button");
        likeBtn.className = "action-icon-btn";
        likeBtn.innerHTML = "👍 <span>1</span>";
        actionGroup.appendChild(likeBtn);

        const dislikeBtn = document.createElement("button");
        dislikeBtn.className = "action-icon-btn";
        dislikeBtn.innerHTML = "👎";
        actionGroup.appendChild(dislikeBtn);

        footerDiv.appendChild(actionGroup);
        contentDiv.appendChild(footerDiv);
        containerDiv.appendChild(contentDiv);

        const optionsBtn = document.createElement("button");
        optionsBtn.className = "comment-options";
        optionsBtn.textContent = "⋮";
        containerDiv.appendChild(optionsBtn);

        messagesContainer.appendChild(containerDiv);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMessage() {
      const text = messageInput.value.trim();
      if (text === "") return;

      const newMsg = {
        id: Date.now(),
        text: text,
        isAdmin: isAdmin,
        time: "الآن"
      };

      messages.push(newMsg);
      localStorage.setItem("youtube_chat_messages", JSON.stringify(messages));
      messageInput.value = "";
      renderMessages();
    }

    sendBtn.addEventListener("click", addMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") addMessage();
    });

    // تفاعل الأزرار العلوية لتأكيد عملها بشكل سليم
    document.getElementById("callBtn").addEventListener("click", () => {
      alert("جاري بدء الاتصال الصوتي...");
    });

    document.getElementById("bellBtn").addEventListener("click", () => {
      alert("تم تفعيل التنبيهات بنجاح.");
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      localStorage.removeItem("chat_logged_in");
      location.reload();
    });

    // تحميل الرسائل عند البدء
    renderMessages();
  </script>
</body>
</html>
